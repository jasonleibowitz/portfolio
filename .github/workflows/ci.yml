name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes the in-flight run for the same ref -- PR or main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo -- don't inherit whatever the repo default becomes.
# `preview` widens this to comment on the pull request, scoped to that job.
permissions:
  contents: read

env:
  # One Worker holds every build. A pull request's preview is a *version* of it
  # reached through an alias, not a separate environment, so nothing is
  # provisioned per branch and nothing needs tearing down.
  WORKER_NAME: portfolio

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field, so CI matches local.
      - uses: pnpm/action-setup@v4

      # Exact pin from .nvmrc -- `engines.node` is an open range and would float.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps so a failure names which gate broke. Cheapest first.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

  # `preview` and `staging` rebuild rather than reuse the `dist/` from `verify`.
  # They set SITE_URL, and preview also sets SHOW_DRAFTS, so their output is
  # deliberately not the bytes that gate produced. Both gate on `verify` anyway:
  # a preview URL is what the design gets judged by, and one published from a
  # red build would be judged as if it were finished.
  preview:
    name: Preview
    needs: verify
    # A pull request from a fork is denied repository secrets by design. Without
    # this the upload fails on a missing token, which reads as the contributor
    # having broken something.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pr-<number>` is always a valid alias: it opens with a letter, contains
      # nothing DNS rejects, and cannot collide the way `feat/x` and `feat-x`
      # would once slashes are replaced. Alias plus Worker name must fit a
      # 63-character DNS label, which this cannot approach.
      #
      # Resolving it here rather than reading it back from the upload is what
      # lets the build below know its own URL.
      # The commit subject is read from the API rather than `git log`: the
      # checkout above is a depth-1 clone of the pull request's *merge* ref, so
      # the head commit's parents -- and its message -- are not in the clone.
      #
      # It is also the one value here an author controls, so it never reaches a
      # shell as anything but a quoted variable. `tr` strips newlines, which
      # would otherwise let a crafted subject forge a second line in
      # $GITHUB_OUTPUT, and the cut bounds a message length Cloudflare does not
      # document a limit for.
      - name: Resolve preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          alias="pr-${{ github.event.pull_request.number }}"
          subject=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message' \
            | head -1 | tr -d '\n\r' | cut -c1-100)
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          echo "url=https://$alias-$WORKER_NAME.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE_URL: ${{ steps.preview.outputs.url }}
          SHOW_DRAFTS: 'true'
        run: pnpm build

      - name: Mark as noindex
        run: node scripts/noindex.mjs

      # `--message` is what the dashboard's version history shows. Left unset,
      # every row reads "Manually deployed" and traces back to nothing.
      # Cloudflare populates branch and commit itself only for Workers Builds,
      # its own CI -- a Worker built here has no build record, so these two
      # flags are the only way to label a version.
      #
      # wrangler runs directly rather than through `cloudflare/wrangler-action`,
      # which takes its command as one string: the subject would be spliced into
      # it and a commit message could then close the quote and run whatever
      # followed. Quoted variable expansion does not re-tokenize, so this form
      # cannot.
      - name: Upload version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: ${{ steps.preview.outputs.alias }}
          SHA: ${{ steps.preview.outputs.sha }}
          SUBJECT: ${{ steps.preview.outputs.subject }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "$ALIAS" \
            --tag "$SHA" \
            --message "PR #$PR_NUMBER $SHA: $SUBJECT"

      # One comment per pull request, rewritten in place. The alias is stable
      # across pushes, so a comment per commit would repeat the same URL.
      - name: Comment preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            // `context.sha` on a pull_request event is GitHub's ephemeral merge
            // commit, which is not in the branch -- naming it defeats the point
            // of saying what got built.
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from \`${sha}\`. Drafts are rendered, and the deploy is noindexed.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The integrated view of `main`, at a stable URL. This is a real deployment,
  # but leibowitz.me still answers from GitHub Pages: no custom domain is
  # attached here, so DNS remains the only thing standing between this and
  # production. Drafts stay hidden, so this shows exactly the published set.
  staging:
    name: Staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `git log` is enough here, unlike in `preview`: a push checks out the
      # pushed commit itself, so its subject is in the depth-1 clone.
      - name: Resolve revision
        id: rev
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          subject=$(git log -1 --pretty=%s | tr -d '\n\r' | cut -c1-100)
          echo "sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE_URL: https://${{ env.WORKER_NAME }}.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
        run: pnpm build

      - name: Mark as noindex
        run: node scripts/noindex.mjs

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ steps.rev.outputs.sha }}
          SUBJECT: ${{ steps.rev.outputs.subject }}
        run: |
          pnpm exec wrangler deploy \
            --tag "$SHA" \
            --message "main $SHA: $SUBJECT"
