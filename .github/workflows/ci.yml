name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field, so CI matches local.
      - uses: pnpm/action-setup@v4

      # Resolves `engines.node` rather than hardcoding a version.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps so a failure names which gate broke.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check
