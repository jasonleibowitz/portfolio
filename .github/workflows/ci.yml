name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes the in-flight run for the same ref -- PR or main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo -- don't inherit whatever the repo default becomes.
# `preview` widens this to comment on the pull request, scoped to that job.
permissions:
  contents: read

env:
  # One Worker holds every build. A preview is a version of that Worker, and an
  # alias points to it. CI makes no new environment for each branch, and has
  # nothing to remove.
  WORKER_NAME: portfolio

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field, so CI matches local.
      - uses: pnpm/action-setup@v4

      # Exact pin from .nvmrc -- `engines.node` is an open range and would float.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps so a failure names which gate broke. Cheapest first.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

  # `preview` and `staging` build again. They do not reuse the `dist/` from
  # `verify`, because they set SITE_URL, and `preview` also sets SHOW_DRAFTS.
  # Both jobs need `verify`, so a failed gate publishes no URL.
  preview:
    name: Publish preview
    needs: verify
    # GitHub gives no repository secrets to a pull request from a fork. Without
    # this condition, the upload fails on a missing token and looks like a break.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pr-<number>` is always a valid alias. It starts with a letter, DNS
      # accepts each character, and two branch names cannot collide. The alias
      # and the Worker name must fit one 63-character DNS label.
      #
      # This step makes the URL, so the build below knows its own address.
      #
      # The commit subject comes from the API, not `git log`: the checkout is a
      # depth-1 clone of the merge ref, which does not contain the head commit
      # message. The author controls this value, so it stays quoted. `tr`
      # removes newlines, which could add a false line to $GITHUB_OUTPUT.
      - name: Resolve preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          alias="pr-${{ github.event.pull_request.number }}"
          subject=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message' \
            | head -1 | tr -d '\n\r' | cut -c1-100)
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          echo "url=https://$alias-$WORKER_NAME.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE_URL: ${{ steps.preview.outputs.url }}
          SHOW_DRAFTS: 'true'
        run: pnpm build

      - name: Mark as noindex
        run: node scripts/noindex.mjs

      # The dashboard shows `--message` in its version history. Without it, each
      # row reads "Manually deployed". Cloudflare fills in the branch and the
      # commit only for its own CI, so these two flags are the only labels.
      #
      # wrangler runs directly, not through `cloudflare/wrangler-action`. That
      # action takes its command as one string, so a commit subject could end
      # the quote and run other commands. A quoted variable cannot do this.
      - name: Upload version to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: ${{ steps.preview.outputs.alias }}
          SHA: ${{ steps.preview.outputs.sha }}
          SUBJECT: ${{ steps.preview.outputs.subject }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "$ALIAS" \
            --tag "$SHA" \
            --message "PR #$PR_NUMBER $SHA: $SUBJECT"

      # One comment per pull request, rewritten in place. The alias is stable
      # across pushes, so a comment per commit would repeat the same URL.
      - name: Comment preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            // `context.sha` on a pull_request event is GitHub's ephemeral merge
            // commit, which is not in the branch -- naming it defeats the point
            // of saying what got built.
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from \`${sha}\`. Drafts are rendered, and the deploy is noindexed.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # `main` at a stable URL. This is a real deployment, but leibowitz.me still
  # answers from GitHub Pages. No custom domain points here yet, so only DNS
  # separates this from production. Drafts stay hidden, so this shows the
  # published set.
  staging:
    name: Deploy staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `git log` is enough here, unlike in `preview`: a push checks out the
      # pushed commit itself, so its subject is in the depth-1 clone.
      - name: Resolve revision
        id: rev
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          subject=$(git log -1 --pretty=%s | tr -d '\n\r' | cut -c1-100)
          echo "sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SITE_URL: https://${{ env.WORKER_NAME }}.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
        run: pnpm build

      - name: Mark as noindex
        run: node scripts/noindex.mjs

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ steps.rev.outputs.sha }}
          SUBJECT: ${{ steps.rev.outputs.subject }}
        run: |
          pnpm exec wrangler deploy \
            --tag "$SHA" \
            --message "main $SHA: $SUBJECT"
