name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes the in-flight run for the same ref -- PR or main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field, so CI matches local.
      - uses: pnpm/action-setup@v4

      # Exact pin from .nvmrc -- `engines.node` is an open range and would float.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps so a failure names which gate broke. Cheapest first.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build
