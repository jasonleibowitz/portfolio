# pnpm 10+ reads settings from here rather than the "pnpm" field in
# package.json. Astro's image pipeline needs sharp to run its build script,
# and the bundler needs esbuild -- without these, `pnpm build` fails on
# image generation with MissingSharp.
allowBuilds:
  esbuild: true
  sharp: true
  # workerd is wrangler's local runtime, and only `wrangler dev` needs it.
  # Skipping its build avoids a ~100MB download on each install.
  workerd: false

# Don't install packages published in the last 24h -- the window in which a
# compromised release is most likely to still be up.
minimumReleaseAge: 1440

# Temporary: typescript-eslint 8.66.0 was published 2026-08-03 17:36 UTC,
# hours before this lockfile was generated. Delete this whole block after
# 2026-08-04 17:36 UTC -- see #16.
